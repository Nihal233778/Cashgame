                                                                                                          
  <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Ad Loop</title>
  <!-- Load your ad SDK (Monetix) -->
  <script src="https://www.monetixads.online/ads.js" data-mxid="MX-CDE2FE45"></script>
  <style>
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #app {
      text-align: center;
      background: #1c1c1e;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
    }
    button {
      background: #f5a623;
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    #log {
      background: #141414;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
      min-height: 80px;
      text-align: left;
      overflow-y: auto;
      max-height: 200px;
      border: 1px solid #2c2c2e;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }
    .stats span {
      font-size: 13px;
      color: #8e8e93;
    }
    .stats strong {
      color: #f5a623;
    }
  </style>
</head>
<body>

<div id="app">
  <h2>🎬 Auto Ad Loop</h2>
  <p style="color: #8e8e93; font-size: 14px;">Click "Start" – then ads will auto‑play</p>

  <div class="stats">
    <span>💰 Earned: <strong id="earned">$0.00</strong></span>
    <span>📺 Ads: <strong id="count">0</strong></span>
  </div>

  <button id="startBtn">▶ Start Auto</button>
  <button id="stopBtn" disabled>⏹ Stop</button>

  <div id="log">⏳ Waiting to start…</div>
</div>

<script>
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  CONFIGURATION
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const AD_REWARD = 0.50;            // dollars per ad
  const COOLDOWN_SECONDS = 30;       // cooldown between ads (set 0 for instant)
  const REWARD_AD_FUNCTION = 'showRewardAd'; // function name from SDK

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  STATE
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  let isRunning = false;
  let isAdLoading = false;
  let totalEarned = 0;
  let adCount = 0;
  let lastAdTime = 0;
  let timerId = null;
  let stopRequested = false;

  // DOM elements
  const logEl = document.getElementById('log');
  const earnedEl = document.getElementById('earned');
  const countEl = document.getElementById('count');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  LOGGING
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function log(msg) {
    const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.textContent += line + '\n';
    logEl.scrollTop = logEl.scrollHeight;
    console.log(line);
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  CORE AD LOGIC
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function canWatchAd() {
    const now = Date.now();
    const cooldownMs = COOLDOWN_SECONDS * 1000;
    return (now - lastAdTime) >= cooldownMs && !isAdLoading;
  }

  function getCooldownRemaining() {
    const elapsed = Date.now() - lastAdTime;
    const remaining = (COOLDOWN_SECONDS * 1000) - elapsed;
    return Math.max(0, Math.ceil(remaining / 1000));
  }

  // This is the function that actually shows the ad.
  // It respects the SDK's requirement to be called from a user gesture
  // for the FIRST call. Subsequent calls from setTimeout are allowed
  // if the SDK doesn't enforce gesture on every call (most do allow).
  function watchAd() {
    if (!isRunning || isAdLoading) return;
    if (!canWatchAd()) {
      const remaining = getCooldownRemaining();
      log(`⏳ Cooldown active – waiting ${remaining}s`);
      scheduleNextAd();
      return;
    }

    // Check if the ad function exists
    if (typeof window[REWARD_AD_FUNCTION] !== 'function') {
      log('❌ Ad SDK not loaded – retrying in 5s');
      setTimeout(scheduleNextAd, 5000);
      return;
    }

    isAdLoading = true;
    log('🎬 Loading ad…');

    try {
      window[REWARD_AD_FUNCTION](function (response) {
        isAdLoading = false;
        log(`📦 Ad response: ${JSON.stringify(response)}`);

        // Many SDKs return "completed" or "closed" for successful view.
        // Adjust based on your SDK's actual response.
        if (response.status === 'completed' || response.status === 'closed') {
          // Grant reward
          totalEarned += AD_REWARD;
          adCount += 1;
          lastAdTime = Date.now();
          updateUI();
          log(`✅ Earned $${AD_REWARD.toFixed(2)} (total: $${totalEarned.toFixed(2)})`);

          // Schedule the next ad after cooldown
          scheduleNextAd();
        } else {
          // Ad was not completed (error, cancelled, etc.)
          log('⚠️ Ad not completed – will retry after cooldown');
          scheduleNextAd();
        }
      });
    } catch (err) {
      isAdLoading = false;
      log(`❌ Error showing ad: ${err.message}`);
      // Retry after a delay
      setTimeout(scheduleNextAd, 5000);
    }
  }

  // Schedules the next ad call respecting the cooldown.
  function scheduleNextAd() {
    if (!isRunning || stopRequested) {
      log('⏹ Auto loop stopped');
      return;
    }

    if (isAdLoading) {
      // If an ad is already loading, wait for it to finish.
      setTimeout(scheduleNextAd, 1000);
      return;
    }

    if (canWatchAd()) {
      // Ready to watch immediately.
      watchAd();
    } else {
      // Wait until cooldown is over.
      const remaining = getCooldownRemaining();
      const waitMs = Math.max(remaining * 1000, 1000);
      log(`⏳ Waiting ${remaining}s for cooldown…`);
      clearTimeout(timerId);
      timerId = setTimeout(() => {
        if (isRunning && !stopRequested) {
          watchAd();
        }
      }, waitMs);
    }
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  UI UPDATE
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function updateUI() {
    earnedEl.textContent = `$${totalEarned.toFixed(2)}`;
    countEl.textContent = adCount;
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  START / STOP
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function startAutoLoop() {
    if (isRunning) return;
    if (typeof window[REWARD_AD_FUNCTION] !== 'function') {
      log('❌ Ad SDK not loaded. Check script URL or network.');
      return;
    }

    stopRequested = false;
    isRunning = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    log('▶️ Auto loop started');

    // Start the first ad immediately (user gesture triggers this via click).
    // The first call is from a click event, which satisfies the gesture requirement.
    watchAd();
  }

  function stopAutoLoop() {
    if (!isRunning) return;
    stopRequested = true;
    isRunning = false;
    clearTimeout(timerId);
    isAdLoading = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    log('⏹ Auto loop stopped');
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  EVENT BINDING
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  startBtn.addEventListener('click', startAutoLoop);
  stopBtn.addEventListener('click', stopAutoLoop);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  //  INITIAL CHECK
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if (typeof window[REWARD_AD_FUNCTION] !== 'function') {
    log('⚠️ Ad SDK not yet loaded – waiting…');
    // Try to detect when it loads (if possible)
    const checkInterval = setInterval(() => {
      if (typeof window[REWARD_AD_FUNCTION] === 'function') {
        clearInterval(checkInterval);
        log('✅ Ad SDK loaded successfully');
      }
    }, 1000);
    // Timeout after 30s
    setTimeout(() => {
      clearInterval(checkInterval);
      if (typeof window[REWARD_AD_FUNCTION] !== 'function') {
        log('❌ Ad SDK failed to load. Check your network and script tag.');
      }
    }, 30000);
  } else {
    log('✅ Ad SDK ready');
  }

  // Log initial instruction
  log('👆 Click "Start Auto" to begin the ad loop');
</script>

</body>
</html>
